<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · Jm3a Hunt</title>
    <style>
      :root { color-scheme: light dark; --bg: #faf9f6; --fg: #1c1d21; --muted: #5d6068; --accent: #ff5a1f; }
      @media (prefers-color-scheme: dark) { :root { --bg: #121316; --fg: #f3f2ef; --muted: #a8abb2; } }
      html, body { height: 100%; margin: 0; }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      main { max-width: 22rem; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
      h1 { margin: 0; font-size: 1.5rem; }
      p { margin: 0; color: var(--muted); }
      button { margin-top: 12px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent); color: #241008; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <span class="dot" aria-hidden="true"></span>
      <h1>You are offline</h1>
      <p>Jm3a Hunt needs a connection for matches. Your location is not shared while you are offline.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
